name: Build Mac App M1

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check architecture
        run: |
          uname -m
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Mac M1 application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --target-arch x86_64 \
            --name "Strategy" \
            --icon "icon.icns" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            app.py

      - name: Ad-hoc sign application
        run: |
          codesign --force --deep --sign - "dist/Strategy.app"

      - name: Verify application
        run: |
          file "dist/Strategy.app/Contents/MacOS/Strategy"
          codesign --verify --deep --strict --verbose=2 "dist/Strategy.app"

      - name: Zip Mac application
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Strategy.app" "Strategy-M1.zip"

      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-M1
          path: dist/Strategy-M1.zip
